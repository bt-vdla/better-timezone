name: Skies
options:
  bundleIdPrefix: com.btstd
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: P6SP5RHNLV
targets:
  Skies:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Skies]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btstd.skies
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skies
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        "INFOPLIST_KEY_LSUIElement[sdk=macosx*]": YES
        "INFOPLIST_KEY_NSSupportsLiveActivities[sdk=iphone*]": YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        # The App Group the widgets read from.
        CODE_SIGN_ENTITLEMENTS: Skies/Skies.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Skies/Skies-macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_CALENDARS: YES
        ENABLE_RESOURCE_ACCESS_CONTACTS: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Skies reads your holiday calendars to show public holidays where your people live."
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Skies adds the calls and meetings you plan to your calendar."
        INFOPLIST_KEY_NSContactsUsageDescription: "Skies shows the photo and birthday of contacts you link to a city."
    dependencies:
      - target: SkiesWidgets
    scheme:
      testTargets: [SkiesTests]
  SkiesTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [SkiesTests]
    dependencies:
      - target: Skies
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Skies.app/Contents/MacOS/Skies"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
  SkiesWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - SkiesWidgets
      - path: Skies/Sky.swift
      - path: Skies/Model.swift
      - path: Skies/People.swift
      - path: Skies/Airports.swift
      - path: Skies/Tags.swift
      - path: Skies/SharedIntents.swift
      - path: Skies/airports.csv
    info:
      path: SkiesWidgets/Info.plist
      properties:
        CFBundleDisplayName: Skies
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btstd.skies.widgets
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: SkiesWidgets/SkiesWidgets.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SkiesWidgets/SkiesWidgets-macOS.entitlements
        ENABLE_APP_SANDBOX: YES
